apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service-example.fullname" . }}
  labels:
    {{- include "service-example.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "service-example.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "service-example.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "service-example.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- if .Values.mongodb.enabled }}
                {{- include "service-example.mongodb-connection-string" . | nindent 14 }}
            {{- end }}
            {{- if .Values.redis.enabled }}
                {{- include "service-example.redis-connection-string" . | nindent 14 }}
            {{- end }}
            {{- if .Values.nats.enabled }}
                {{- include "service-example.nats-connection-string" . | nindent 14 }}
            {{- end }}
